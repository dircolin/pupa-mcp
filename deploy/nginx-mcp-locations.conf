  # ── PUPA MCP (port 8790) — proxy.pupastage.com/mcp  ──
  location = /mcp {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 20m;
  }
  location /mcp/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
  }
  location /.well-known/oauth-authorization-server { proxy_pass http://127.0.0.1:8790; proxy_set_header Host $host; }
  location /.well-known/oauth-protected-resource   { proxy_pass http://127.0.0.1:8790; proxy_set_header Host $host; }
